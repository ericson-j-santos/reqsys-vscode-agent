name: Legacy Fly.io Public Deploy

on:
  pull_request:
    paths:
      - ".github/workflows/flyio-deploy.yml"
      - "docs/RUNTIME_ROUTING_CURRENT.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-flyio-route:
    name: legacy-flyio-route
    runs-on: ubuntu-latest
    env:
      EVIDENCE_DIR: .reqsys/evidence/legacy-flyio-route
    steps:
      - name: Record legacy status
        run: |
          mkdir -p "${EVIDENCE_DIR}"
          cat > "${EVIDENCE_DIR}/summary.md" <<EOF
          # Legacy Fly.io route

          - Domain: REQSYS#002.RUNTIME_PUBLICO.RUNTIME_ROUTING
          - Status: legacy
          - Active route: non-Fly runtime routing / PC24x7-first
          - Commit: ${GITHUB_SHA}
          - Workflow: ${GITHUB_WORKFLOW}
          - Run ID: ${GITHUB_RUN_ID}

          ## Decision

          Fly.io is no longer the active deployment route for this project. This workflow is retained only to make the deprecation explicit and to avoid accidental Fly.io deploy attempts from stale instructions.

          ## Required next action

          Use the runtime routing contract and runtime smoke monitor against the selected non-Fly target.
          EOF

          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          ## Fly.io route archived

          Fly.io is not the active runtime route. No deploy was attempted.
          EOF

      - name: Upload legacy route evidence
        uses: actions/upload-artifact@v4
        with:
          name: legacy-flyio-route-evidence
          path: .reqsys/evidence/legacy-flyio-route
          retention-days: 14
